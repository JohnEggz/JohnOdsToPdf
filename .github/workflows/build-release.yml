name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip_name: GeneratorZaswiadczen-Windows.zip
            sha_name: GeneratorZaswiadczen-Windows.zip.sha256
            launcher_name: Start_Generator.exe
          - os: ubuntu-latest
            zip_name: GeneratorZaswiadczen-Linux.zip
            sha_name: GeneratorZaswiadczen-Linux.zip.sha256
            launcher_name: Start_Generator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tkinter needs to be present on the Linux runner to build the GUI correctly
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      # ==========================================
      # 1. MAIN APP BUILD & ZIP
      # ==========================================
      - name: Build & Zip App (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed `
            --add-data "assets;assets" `
            --add-data "web;web" `
            --name "GeneratorZaswiadczen" `
            app.py
          Compress-Archive -Path dist\GeneratorZaswiadczen -DestinationPath ${{ matrix.zip_name }}
          $hash = (Get-FileHash ${{ matrix.zip_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.zip_name }}" | Out-File -FilePath ${{ matrix.sha_name }} -Encoding ascii

      - name: Build & Zip App (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed \
            --add-data "assets:assets" \
            --add-data "web:web" \
            --name "GeneratorZaswiadczen" \
            app.py
          cd dist
          zip -r ../${{ matrix.zip_name }} GeneratorZaswiadczen
          cd ..
          sha256sum ${{ matrix.zip_name }} > ${{ matrix.sha_name }}

      # ==========================================
      # 2. LAUNCHER BUILD
      # ==========================================
      - name: Build Launcher (Windows)
        if: runner.os == 'Windows'
        run: uv run pyinstaller --noconfirm --onefile --windowed --name "Start_Generator" launcher.py

      - name: Build Launcher (Linux)
        if: runner.os == 'Linux'
        run: uv run pyinstaller --noconfirm --onefile --name "Start_Generator" launcher.py

      # ==========================================
      # 3. UPLOAD EVERYTHING TO RELEASE
      # ==========================================
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.zip_name }}
            ${{ matrix.sha_name }}
            dist/${{ matrix.launcher_name }}
          generate_release_notes: true
