name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        # uv sync automatically reads pyproject.toml and uv.lock 
        # to recreate your exact local virtual environment.
        run: uv sync

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed `
            --add-data "assets;assets" `
            --add-data "web;web" `
            --name "GeneratorZaswiadczen" `
            app.py

      - name: Zip the build folder
        run: Compress-Archive -Path dist\GeneratorZaswiadczen -DestinationPath GeneratorZaswiadczen-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GeneratorZaswiadczen-Windows.zip
          generate_release_notes: true
